name: WhiteBoard local environment (Phase 1)

# Brings up PostgreSQL + Redis wired to apps/web/.env.example.
#   docker compose -f infra/docker-compose.yml up -d
# Run migrations/seeds:
#   pnpm db:migrate && pnpm db:seed

services:
  db:
    image: postgres:16-alpine
    container_name: whiteboard-db
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard -d whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10